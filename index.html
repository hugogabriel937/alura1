<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monalisa Interativa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Monalisa Interativa</h1>
        <p class="subtitle">Mova o mouse para ver os olhos acompanharem o movimento</p>
        
        <svg class="monalisa" width="400" height="500" viewBox="0 0 400 500">
            <!-- Fundo (céu e paisagem) -->
            <defs>
                <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="skinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#DEB887;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#C9A876;stop-opacity:1" />
                </linearGradient>
            </defs>
            
            <!-- Céu e paisagem -->
            <rect width="400" height="500" fill="url(#skyGradient)"/>
            
            <!-- Montanhas ao fundo -->
            <path d="M 0 300 Q 100 200 200 250 T 400 300 L 400 500 L 0 500" fill="#8B7355" opacity="0.6"/>
            <path d="M 0 350 Q 80 280 150 320 T 350 340 L 400 350 L 400 500 L 0 500" fill="#A0826D" opacity="0.5"/>
            
            <!-- Corpo -->
            <ellipse cx="200" cy="320" rx="70" ry="90" fill="url(#skinGradient)"/>
            
            <!-- Pescoço -->
            <rect x="180" y="290" width="40" height="40" fill="url(#skinGradient)" rx="10"/>
            
            <!-- Cabeça -->
            <ellipse cx="200" cy="180" rx="65" ry="80" fill="url(#skinGradient)"/>
            
            <!-- Cabelo (castanho escuro) -->
            <path d="M 135 140 Q 140 80 200 60 Q 260 80 265 140" fill="#3E2723" stroke="#2C1810" stroke-width="2"/>
            <ellipse cx="200" cy="120" rx="60" ry="70" fill="#3E2723"/>
            <path d="M 135 160 Q 140 120 200 100 Q 260 120 265 160" fill="#5D4037" opacity="0.7"/>
            
            <!-- Rosto -->
            <ellipse cx="200" cy="180" rx="60" ry="75" fill="#DEB887" stroke="#C9A876" stroke-width="1"/>
            
            <!-- Orelhas -->
            <ellipse cx="145" cy="160" rx="18" ry="25" fill="#C9A876"/>
            <ellipse cx="255" cy="160" rx="18" ry="25" fill="#C9A876"/>
            
            <!-- Olho esquerdo (acompanhará o mouse) -->
            <g class="eye left-eye">
                <circle cx="165" cy="160" r="18" fill="#FFFFFF" stroke="#8B7355" stroke-width="1.5"/>
                <circle class="pupil" cx="165" cy="160" r="10" fill="#2C1810"/>
                <circle cx="168" cy="157" r="4" fill="#FFFFFF" opacity="0.8"/>
            </g>
            
            <!-- Olho direito (acompanhará o mouse) -->
            <g class="eye right-eye">
                <circle cx="235" cy="160" r="18" fill="#FFFFFF" stroke="#8B7355" stroke-width="1.5"/>
                <circle class="pupil" cx="235" cy="160" r="10" fill="#2C1810"/>
                <circle cx="238" cy="157" r="4" fill="#FFFFFF" opacity="0.8"/>
            </g>
            
            <!-- Sobrancelhas -->
            <path d="M 150 145 Q 165 138 180 142" stroke="#2C1810" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M 220 142 Q 235 138 250 145" stroke="#2C1810" stroke-width="3" fill="none" stroke-linecap="round"/>
            
            <!-- Nariz -->
            <path d="M 200 160 L 195 190 L 200 195 L 205 190 Z" fill="#C9A876" stroke="#B39380" stroke-width="0.5"/>
            
            <!-- Boca (sorriso místico) -->
            <path d="M 175 220 Q 200 235 225 220" stroke="#A0574B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M 175 220 Q 200 232 225 220" fill="#C9967B" opacity="0.4"/>
            
            <!-- Rugas de expressão (sutis) -->
            <path d="M 145 200 Q 155 210 165 205" stroke="#B39380" stroke-width="1" fill="none" opacity="0.5" stroke-linecap="round"/>
            <path d="M 235 205 Q 245 210 255 200" stroke="#B39380" stroke-width="1" fill="none" opacity="0.5" stroke-linecap="round"/>
            
            <!-- Braço esquerdo -->
            <path d="M 140 300 Q 100 340 95 380" stroke="#C9A876" stroke-width="20" fill="none" stroke-linecap="round"/>
            <ellipse cx="90" cy="390" rx="15" ry="20" fill="#C9A876"/>
            
            <!-- Braço direito -->
            <path d="M 260 300 Q 300 340 305 380" stroke="#C9A876" stroke-width="20" fill="none" stroke-linecap="round"/>
            <ellipse cx="310" cy="390" rx="15" ry="20" fill="#C9A876"/>
            
            <!-- Vestido (ocre/marrom claro) -->
            <ellipse cx="200" cy="380" rx="75" ry="70" fill="#8B6914"/>
            <path d="M 125 330 Q 120 420 150 450 L 250 450 Q 280 420 275 330" fill="#A0826D"/>
        </svg>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
